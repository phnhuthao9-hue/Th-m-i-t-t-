<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Không dành cho bạn 🔒</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#d8ebe6;
    font-family:Arial,sans-serif;
}

.container{
    text-align:center;
}

.lock{
    font-size:70px;
    margin-bottom:10px;
}

.title{
    font-size:32px;
    font-weight:bold;
    margin-bottom:20px;
}

.password{
    width:220px;
    height:50px;
    border:none;
    border-radius:30px;
    text-align:center;
    font-size:30px;
    background:white;
    margin-bottom:30px;
}

.keypad{
    display:grid;
    grid-template-columns:repeat(3,80px);
    gap:12px;
    justify-content:center;
}

button{
    width:80px;
    height:80px;
    border:none;
    border-radius:50%;
    font-size:28px;
    cursor:pointer;
}

.error{
    color:red;
    margin-top:15px;
    height:20px;
}
</style>
</head>

<body>

<div class="container">

<div class="lock">🔒</div>

<div class="title">
Không dành cho bạn
</div>

<input
id="display"
class="password"
readonly>

<div class="keypad">
<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>

<button onclick="clearPass()">⌫</button>
<button onclick="add('0')">0</button>
<button onclick="clearAll()">C</button>
</div>

<div id="error" class="error"></div>

</div>

<script>

const PASSWORD = "1909";

let value = "";

function add(num){

if(value.length >= 4) return;

value += num;

document.getElementById("display").value =
"●".repeat(value.length);

if(value.length === 4){

if(value === PASSWORD){

window.location.href =
"https://canva.link/950mygs44plh57t";

}else{

document.getElementById("error").innerText =
"Wrong Password";

setTimeout(()=>{
value="";
document.getElementById("display").value="";
document.getElementById("error").innerText="";
},1200);

}

}

}

function clearPass(){
value = value.slice(0,-1);
document.getElementById("display").value =
"●".repeat(value.length);
}

function clearAll(){
value="";
document.getElementById("display").value="";
}

</script>

</body>
</html>
